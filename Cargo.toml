[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2021"
version = "0.1.4"
license = "MIT"

[workspace.dependencies]
act_core = { path = "crates/core" }
act_store = { path = "crates/store" }
act_engines = { path = "crates/engines" }
act_host = { path = "crates/host" }
act_terminal = { path = "crates/terminal" }
act_markdown = { path = "crates/markdown" }
act_ui = { path = "crates/ui" }
# vendor/zed: Zed v1.28.1 (e8bc16ace) with our patches; see ARCHITECTURE.md.
gpui = { path = "vendor/zed/gpui", default-features = false, features = ["font-kit"] }
gpui_platform = { path = "vendor/zed/gpui_platform", default-features = false, features = ["font-kit", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
# 0.15.0 with Chromium's layout unit, negative-margin intrinsic sizes and snap_origin; see ARCHITECTURE.md.
taffy = { path = "vendor/taffy" }
