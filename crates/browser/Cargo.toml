[package]
name = "act_browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
rusqlite.workspace = true
act_core.workspace = true
act_host.workspace = true
act_ui.workspace = true
futures = "0.3"
url = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
sha2 = "0.10"
dirs = "5"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
wry = "0.57"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
javascriptcore-rs = "=1.1.2"
soup = { package = "soup3", version = "0.5" }
cairo-rs = { version = "0.18", features = ["png"] }
x11-dl = "2.21"
libc = "0.2"
image = { version = "0.25", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSError", "NSDictionary", "NSArray", "NSData", "NSDate", "NSSet", "NSUUID", "NSHTTPCookie", "NSKeyValueObserving", "NSValue", "NSGeometry", "NSObject", "NSThread", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSScreen", "NSColor", "NSApplication", "block2", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse", "WKFrameInfo", "WKSecurityOrigin", "WKContentWorld", "WKSnapshotConfiguration", "WKPDFConfiguration", "WKFindConfiguration", "WKFindResult", "WKHTTPCookieStore", "WKWebsiteDataStore", "WKWebsiteDataRecord", "WKUIDelegate", "WKWindowFeatures", "WKUserContentController", "WKPreferences", "WKError", "block2", "objc2-app-kit", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui = { workspace = true, features = ["wayland", "x11"] }

[[example]]
name = "browser"
