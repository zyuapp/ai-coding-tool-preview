[package]
name = "act_host"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs", "time", "sync", "macros", "io-util", "net"] }
futures = "0.3"
croner = "4"
chrono-tz = "0.10"
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
http-body-util = "0.1"
bytes = "1"
tokio-util = "0.7"
http = "1"
tower-service = "0.3"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tracing = "0.1"
act_core.workspace = true
act_store.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "json"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
pulldown-cmark = { version = "0.13", default-features = false }
getrandom = "0.3"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSMenu", "NSMenuItem", "NSResponder"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
